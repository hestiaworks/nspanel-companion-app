name: Publish signed APK

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE="$(python3 tools/version-code.py "$VERSION")"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Restore permanent signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NSPANEL_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nspanel-release.jks"
          chmod 600 "$RUNNER_TEMP/nspanel-release.jks"
      - name: Build signed release artifacts
        env:
          NSPANEL_RELEASE_KEYSTORE: ${{ runner.temp }}/nspanel-release.jks
          NSPANEL_RELEASE_KEY_ALIAS: ${{ secrets.NSPANEL_RELEASE_KEY_ALIAS }}
          NSPANEL_RELEASE_STORE_PASSWORD: ${{ secrets.NSPANEL_RELEASE_STORE_PASSWORD }}
          NSPANEL_RELEASE_KEY_PASSWORD: ${{ secrets.NSPANEL_RELEASE_KEY_PASSWORD }}
          NSPANEL_VERSION_CODE: ${{ steps.version.outputs.code }}
          NSPANEL_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: tools/build-release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v$VERSION" release-output/* --generate-notes --verify-tag $PRERELEASE
